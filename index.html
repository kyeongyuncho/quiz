    <title>개인정보 보호 가로세로 낱말퀴즈</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-container">

    <!-- 제목 -->
    <header class="quiz-header">
        <div class="small-title">PERSONAL INFORMATION PROTECTION</div>
        <h1>개인정보 보호<br>가로세로 낱말퀴즈</h1>
    </header>


    <!-- 낱말퍼즐 -->
    <section class="puzzle-card">

        <div id="puzzleGrid" class="puzzle-grid"></div>

    </section>

    </div>

</section>

    <!-- 문제 -->
    <section class="question-card">

    <div id="questionNumber" class="question-number">
        문제를 선택해주세요
    </div>

    <div id="questionText" class="question-text">
        퍼즐의 칸을 클릭하면 문제가 나타납니다.
    </div>

    <div class="answer-area">

        <input
            type="text"
            id="answerInput"
            class="answer-input"
            placeholder="정답을 입력하세요"
            autocomplete="off"
        >

        <button
            type="button"
            id="answerButton"
            class="answer-button"
        >
            입력
        </button>

    </div>

</section>
</div>
