<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>낱말퀴즈 관리자</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            background: #f4f6fa;
        }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 900;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 999px;
            background: #e7efff;
            color: #2457d6;
            font-weight: 800;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .admin-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }

        .admin-card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .current-question {
            font-size: 30px;
            font-weight: 900;
            margin: 15px 0;
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .control-buttons button {
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: #2457d6;
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .control-buttons button.secondary {
            background: #e9edf5;
            color: #172033;
        }

        .participant-count {
            font-size: 36px;
            font-weight: 900;
        }

        .admin-ranking-row,
        .answer-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .answer-row {
            grid-template-columns: 80px 1fr 100px 100px;
        }

        .correct {
            color: #17834b;
            font-weight: 800;
        }

        .wrong {
            color: #d84a4a;
            font-weight: 800;
        }

        @media (max-width: 700px) {

            .admin-grid {
                grid-template-columns: 1fr;
            }

            .control-buttons {
                grid-template-columns: 1fr 1fr;
            }

            .admin-container {
                padding: 14px;
            }

        }

    </style>

</head>


<body>

<div class="admin-container">

    <header class="admin-header">

        <div>

            <div class="admin-title">
                🔐 개인정보 보호 낱말퀴즈 관리자
            </div>

            <div>
                실시간 진행 관리
            </div>

        </div>

        <div
            id="quizStatus"
            class="status-badge"
        >
            대기 중
        </div>

    </header>


    <!-- 문제 진행 -->
    <section class="admin-card">

        <h2>문제 진행</h2>

        <div
            id="currentQuestion"
            class="current-question"
        >
            시작 전
        </div>

        <div
            id="currentClue"
            style="margin-bottom:20px;"
        >
            -
        </div>


        <div class="control-buttons">

            <button
                id="startButton"
            >
                문제 시작
            </button>

            <button
                id="previousButton"
                class="secondary"
            >
                이전 문제
            </button>

            <button
                id="nextButton"
            >
                다음 문제
            </button>

            <button
                id="pauseButton"
                class="secondary"
            >
                일시정지
            </button>

        </div>

    </section>


    <br>


    <div class="admin-grid">

        <!-- 참가자 -->
        <section class="admin-card">

            <h2>현재 참가자</h2>

            <div
                id="participantCount"
                class="participant-count"
            >
                0
            </div>

            <div>
                명
            </div>

        </section>


        <!-- 순위 -->
        <section class="admin-card">

            <h2>🏆 실시간 TOP 5</h2>

            <div id="adminRanking">
                -
            </div>

        </section>

    </div>


    <br>


    <!-- 답안 -->
    <section class="admin-card">

        <h2>
            참가자 답안 현황
        </h2>

        <div id="answerList">
            아직 답안이 없습니다.
        </div>

    </section>


    <br>


    <!-- 참가자 전체 -->
    <section class="admin-card">

        <h2>
            참가자 목록
        </h2>

        <div id="participantList">
            -
        </div>

    </section>

</div>


<script
    type="module"
    src="./admin.js"
></script>

</body>
</html>
